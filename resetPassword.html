<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barber App - Nova Senha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .password-container { position: relative; }
        #loadingScreen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 9999; flex-direction: column;
            justify-content: center; align-items: center;
        }
        /* Mantendo a animação clássica do poste de barbeiro */
        .barber-pole {
            width: 50px; height: 180px; border: 4px solid #ddd; border-radius: 25px;
            position: relative; overflow: hidden; background: white;
            box-shadow: 0 0 25px rgba(255, 157, 0, 0.3);
        }
        .barber-pole::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 200%; 
            background: repeating-linear-gradient(-45deg, #ff0000, #ff0000 20px, #ffffff 20px, #ffffff 40px, #0000ff 40px, #0000ff 60px, #ffffff 60px, #ffffff 80px);
            animation: moveStripes 5s linear infinite;
        }
        .pole-cap { width: 60px; height: 20px; background: linear-gradient(to bottom, #eee, #999, #eee); border-radius: 8px; position: absolute; left: -5px; z-index: 2; }
        .cap-top { top: -15px; } .cap-bottom { bottom: -15px; }
        @keyframes moveStripes { from { transform: translateY(0px); } to { transform: translateY(-100px); } }
        .loading-text { margin-top: 30px; color: #ff9d00; font-size: 18px; letter-spacing: 3px; text-align: center; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="text-gray-800">

    <div id="loadingScreen">
        <div style="position: relative;">
            <div class="pole-cap cap-top"></div>
            <div class="barber-pole"></div>
            <div class="pole-cap cap-bottom"></div>
        </div>
        <div class="loading-text">ATUALIZANDO SENHA...</div>
    </div>

    <div class="flex items-center justify-center min-h-screen bg-gray-100">
        <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-lg shadow-lg mx-4">
            <div class="text-center">
                <i class="fas fa-key text-5xl text-slate-700"></i>
                <h2 class="mt-4 text-3xl font-bold text-gray-900">Nova Senha</h2>
                <p class="mt-2 text-sm text-gray-600">Escolha sua nova senha de acesso</p>
            </div>
            
            <form id="reset-password-form">
                <div class="space-y-4">
                    <div class="password-container">
                        <input type="password" id="new-password" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-500" placeholder="Nova Senha" required>
                        <i class="fas fa-eye-slash absolute top-1/2 right-4 -translate-y-1/2 cursor-pointer text-gray-400" data-toggle-password="new-password"></i>
                    </div>

                    <div class="password-container">
                        <input type="password" id="confirm-password" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-500" placeholder="Confirmar Nova Senha" required>
                        <i class="fas fa-eye-slash absolute top-1/2 right-4 -translate-y-1/2 cursor-pointer text-gray-400" data-toggle-password="confirm-password"></i>
                    </div>
                </div>

                <button type="submit" class="w-full px-4 py-2 mt-6 font-semibold text-white bg-[#334155] rounded-md hover:opacity-90">Alterar Senha</button>
            </form>

            <p class="mt-6 text-center text-sm">
                <a href="index.html" class="font-medium text-slate-700 hover:underline">Voltar para o Login</a>
            </p>
        </div>
    </div>

    <script type="module" src="./src/api/resetPassword.js"></script>
</body>
</html>
